[package]
name = "diffui"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["core"]
resolver = "3"

[features]
iced-debug = ["iced/debug"]
# Profiling-only: swaps in a global allocator that tracks current/peak bytes.
# Adds atomic bookkeeping to every alloc, so never enable it for normal builds.
track-alloc = ["diffui-core/track-alloc"]
# Draws the submenu trajectory-guard triangle (apex + flyout edge + live cursor)
# over open menus. Off by default; enable when tuning the guard.
trajectory-debug = []

[dependencies]
anyhow = "1.0"
diffui-core = { path = "core" }
clap = { version = "4.5", features = ["derive"] }
iced = { git = "https://github.com/iced-rs/iced.git", features = ["advanced", "tokio", "debug", "canvas"] }
jj-lib = "0.40.0"
mimalloc = "0.1"
futures = "0.3"
nucleo-matcher = "0.3"
raw-window-handle = "0.6"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.44", features = ["process", "time"] }
toml = "0.8"

# macOS-only AppKit bridges: `chrome` repositions the native traffic lights to
# the center of our tab strip, and `macos_native` shows real `NSMenu` popups for
# the revision context menu. We only talk to AppKit through `msg_send!` on raw
# pointers / generated bindings (never across the winit boundary), so our objc2
# version is independent of whatever winit pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "NSObjCRuntime", "NSValue"] }
objc2-app-kit = { version = "0.3", features = [
    "NSMenu",
    "NSMenuItem",
    "NSEvent",
    "NSResponder",
    "NSApplication",
    "NSView",
    "NSWindow",
] }
# Core Animation for the right-clicked-row glow: a CALayer animates on the
# window server (a separate process), so its pulse keeps running even while the
# modal NSMenu blocks our main thread. CGColor/CGRect come from the core-graphics
# / core-foundation bindings the quartz-core layer APIs are typed against.
objc2-quartz-core = { version = "0.3", features = [
    "CALayer",
    "CAAnimation",
    "CAMediaTiming",
    "CAMediaTimingFunction",
    "CATransaction",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-core-graphics = { version = "0.3", features = ["CGColor"] }

[profile.dev]
debug = 1

[profile.profiling]
inherits = "release"
debug = true
