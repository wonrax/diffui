[package]
name = "diffui"
version = "0.1.0"
edition = "2024"

[features]
iced-debug = ["iced/debug"]
# Profiling-only: swaps in a global allocator that tracks current/peak bytes.
# Adds atomic bookkeeping to every alloc, so never enable it for normal builds.
track-alloc = []
# Draws the submenu trajectory-guard triangle (apex + flyout edge + live cursor)
# over open menus. Off by default; enable when tuning the guard.
trajectory-debug = []

[dependencies]
anyhow = "1.0"
arborium = { version = "2.16.0", features = [
    "lang-ada",
    "lang-agda",
    "lang-asciidoc",
    "lang-asm",
    "lang-awk",
    "lang-bash",
    "lang-batch",
    "lang-c",
    "lang-c-sharp",
    "lang-caddy",
    "lang-capnp",
    "lang-cedar",
    "lang-cedarschema",
    "lang-clojure",
    "lang-cmake",
    "lang-cobol",
    "lang-commonlisp",
    "lang-cpp",
    "lang-css",
    "lang-d",
    "lang-dart",
    "lang-devicetree",
    "lang-diff",
    "lang-dockerfile",
    "lang-dot",
    "lang-elisp",
    "lang-elixir",
    "lang-elm",
    "lang-erlang",
    "lang-fish",
    "lang-fsharp",
    "lang-gleam",
    "lang-glsl",
    "lang-go",
    "lang-graphql",
    "lang-groovy",
    "lang-haskell",
    "lang-hcl",
    "lang-hlsl",
    "lang-html",
    "lang-idris",
    "lang-ini",
    "lang-java",
    "lang-javascript",
    "lang-jinja2",
    "lang-jq",
    "lang-json",
    "lang-julia",
    "lang-kotlin",
    "lang-lean",
    "lang-lua",
    "lang-markdown",
    "lang-matlab",
    "lang-meson",
    "lang-ninja",
    "lang-nix",
    "lang-objc",
    "lang-ocaml",
    "lang-perl",
    "lang-php",
    "lang-postscript",
    "lang-powershell",
    "lang-prolog",
    "lang-python",
    "lang-query",
    "lang-r",
    "lang-rego",
    "lang-rescript",
    "lang-ron",
    "lang-ruby",
    "lang-rust",
    "lang-scala",
    "lang-scheme",
    "lang-scss",
    "lang-solidity",
    "lang-sparql",
    "lang-sql",
    "lang-ssh-config",
    "lang-starlark",
    "lang-styx",
    "lang-svelte",
    "lang-swift",
    "lang-textproto",
    "lang-thrift",
    "lang-tlaplus",
    "lang-toml",
    "lang-tsx",
    "lang-typescript",
    "lang-typst",
    "lang-uiua",
    "lang-vb",
    "lang-verilog",
    "lang-vhdl",
    "lang-vim",
    "lang-vue",
    "lang-wit",
    "lang-x86asm",
    "lang-xml",
    "lang-yaml",
    "lang-yuri",
    "lang-zig",
    "lang-zsh",
] }
# Already in the lock file via jj-lib; used only to build a `DatePatternContext`
# for parsing user revsets (relative-date functions like `author_date(...)`).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
iced = { git = "https://github.com/iced-rs/iced.git", features = ["advanced", "tokio", "debug", "canvas"] }
jj-lib = "0.40.0"
mimalloc = "0.1"
bstr = "1.12"
futures = "0.3"
notify = "8"
nucleo-matcher = "0.3"
raw-window-handle = "0.6"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.44", features = ["process", "time"] }
toml = "0.8"

# macOS-only AppKit bridges: `chrome` repositions the native traffic lights to
# the center of our tab strip, and `macos_native` shows real `NSMenu` popups for
# the revision context menu. We only talk to AppKit through `msg_send!` on raw
# pointers / generated bindings (never across the winit boundary), so our objc2
# version is independent of whatever winit pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "NSObjCRuntime", "NSValue"] }
objc2-app-kit = { version = "0.3", features = [
    "NSMenu",
    "NSMenuItem",
    "NSEvent",
    "NSResponder",
    "NSApplication",
    "NSView",
    "NSWindow",
] }
# Core Animation for the right-clicked-row glow: a CALayer animates on the
# window server (a separate process), so its pulse keeps running even while the
# modal NSMenu blocks our main thread. CGColor/CGRect come from the core-graphics
# / core-foundation bindings the quartz-core layer APIs are typed against.
objc2-quartz-core = { version = "0.3", features = [
    "CALayer",
    "CAAnimation",
    "CAMediaTiming",
    "CAMediaTimingFunction",
    "CATransaction",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-core-graphics = { version = "0.3", features = ["CGColor"] }

[profile.dev]
debug = 1

[profile.profiling]
inherits = "release"
debug = true
