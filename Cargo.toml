[package]
name = "diffui"
version = "0.1.0"
edition = "2024"

[features]
iced-debug = ["iced/debug"]
# Profiling-only: swaps in a global allocator that tracks current/peak bytes.
# Adds atomic bookkeeping to every alloc, so never enable it for normal builds.
track-alloc = []

[dependencies]
anyhow = "1.0"
# Only used to construct a `DatePatternContext` for jj-lib's revset parser when
# resolving the short change-id prefix disambiguation set. jj-lib already
# depends on chrono, so this pins no new transitive tree.
chrono = "0.4"
arborium = { version = "2.16.0", features = [
    "lang-ada",
    "lang-agda",
    "lang-asciidoc",
    "lang-asm",
    "lang-awk",
    "lang-bash",
    "lang-batch",
    "lang-c",
    "lang-c-sharp",
    "lang-caddy",
    "lang-capnp",
    "lang-cedar",
    "lang-cedarschema",
    "lang-clojure",
    "lang-cmake",
    "lang-cobol",
    "lang-commonlisp",
    "lang-cpp",
    "lang-css",
    "lang-d",
    "lang-dart",
    "lang-devicetree",
    "lang-diff",
    "lang-dockerfile",
    "lang-dot",
    "lang-elisp",
    "lang-elixir",
    "lang-elm",
    "lang-erlang",
    "lang-fish",
    "lang-fsharp",
    "lang-gleam",
    "lang-glsl",
    "lang-go",
    "lang-graphql",
    "lang-groovy",
    "lang-haskell",
    "lang-hcl",
    "lang-hlsl",
    "lang-html",
    "lang-idris",
    "lang-ini",
    "lang-java",
    "lang-javascript",
    "lang-jinja2",
    "lang-jq",
    "lang-json",
    "lang-julia",
    "lang-kotlin",
    "lang-lean",
    "lang-lua",
    "lang-markdown",
    "lang-matlab",
    "lang-meson",
    "lang-ninja",
    "lang-nix",
    "lang-objc",
    "lang-ocaml",
    "lang-perl",
    "lang-php",
    "lang-postscript",
    "lang-powershell",
    "lang-prolog",
    "lang-python",
    "lang-query",
    "lang-r",
    "lang-rego",
    "lang-rescript",
    "lang-ron",
    "lang-ruby",
    "lang-rust",
    "lang-scala",
    "lang-scheme",
    "lang-scss",
    "lang-solidity",
    "lang-sparql",
    "lang-sql",
    "lang-ssh-config",
    "lang-starlark",
    "lang-styx",
    "lang-svelte",
    "lang-swift",
    "lang-textproto",
    "lang-thrift",
    "lang-tlaplus",
    "lang-toml",
    "lang-tsx",
    "lang-typescript",
    "lang-typst",
    "lang-uiua",
    "lang-vb",
    "lang-verilog",
    "lang-vhdl",
    "lang-vim",
    "lang-vue",
    "lang-wit",
    "lang-x86asm",
    "lang-xml",
    "lang-yaml",
    "lang-yuri",
    "lang-zig",
    "lang-zsh",
] }
clap = { version = "4.5", features = ["derive"] }
iced = { git = "https://github.com/iced-rs/iced.git", features = ["advanced", "tokio", "debug", "canvas"] }
jj-lib = "0.40.0"
mimalloc = "0.1"
bstr = "1.12"
futures = "0.3"
notify = "8"
nucleo-matcher = "0.3"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.44", features = ["process", "time"] }
toml = "0.8"

[profile.dev]
debug = 1

# Cosmic-text shaping and iced's text/wgpu paths dominate per-frame cost
# in the diff view (~40 paragraph shapes per scroll frame). At dev's
# default opt-level=0 each shape is ~10× slower than release, which
# makes scrolling dense diffs in a debug build feel like a slideshow.
# Building deps at opt-level=3 keeps our code unoptimized (fast
# incremental rebuilds, full debuggability) while the upstream hot path
# runs at release speed.
[profile.dev.package."*"]
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
