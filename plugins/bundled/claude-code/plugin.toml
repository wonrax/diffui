# Claude Code, the `claude` program, as diffui's AI: `claude -p` with the
# prompt as its argument and the diff on stdin. Bundled with diffui;
# Settings → AI picks it, and `diffui plugin eject claude-code` copies it out
# to edit.
id = "claude-code"
name = "Claude Code"
version = "1.0.0"
api = 0
main = "main.ts"

[permissions]
exec = [["{config.program}"]]

[provides.ai]
ready = "program"
model = "model"

[config.schema]
program = { type = "path", default = "claude", label = "The claude program" }
model = { type = "string", label = "Model", hint = "Passed as --model. Empty uses Claude Code's own." }
