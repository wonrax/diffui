# GitLab (gitlab.com, or a self-hosted GitLab), through the `glab` CLI's
# `glab api` or a token. Bundled with diffui; Settings → Plugins → GitLab
# picks how each host signs in, and `diffui plugin eject gitlab` copies it
# out to edit.
id = "gitlab"
name = "GitLab"
version = "1.1.0"
api = 0
main = "main.ts"

[permissions]
# The API of every host this forge claims (its /api/v4), for the hosts
# signed in with a token.
http = ["{forge.hosts}"]
exec = [["{config.program}", "api"]]
# GITLAB_HOST is set for glab; the tokens are read the way glab reads them.
env = ["GITLAB_HOST", "GITLAB_TOKEN", "GITLAB_ACCESS_TOKEN"]
# The hosts glab is configured for, from its config file, found the way glab
# finds it.
read = ["${GLAB_CONFIG_DIR:-${XDG_CONFIG_HOME:-~/.config}/glab-cli}/config.yml"]

# gitlab.com, and any host named like a GitLab (`gitlab.acme.org`).
[provides.forge]
hosts = ["gitlab", "gitlab.*", "*.gitlab", "*.gitlab.*"]
term = "merge request"
sigil = "!"
short = "MR"
default_host = "gitlab.com"
host_env = "GITLAB_HOST"
cli = "glab"
pull_request_path = "{owner}/{name}/-/merge_requests/{number}"
subgroups = true

[config.schema]
auth = { type = "enum", values = ["auto", "cli", "token"], default = "auto", per_host = true, label = "Sign in with", hint = "Auto uses glab where it is signed in, else a token." }
program = { type = "path", default = "glab", label = "The glab program" }
api_url = { type = "string", per_host = true, label = "API address", hint = "Only for a server whose API isn't at https://<host>/api/v4." }

# A personal access token per host, with the `api` scope (`read_api` is
# enough to read; opening merge requests needs `api`).
[config.schema.token]
type = "secret"
per_host = true
label = "Token"
page = "https://{host}/-/user_settings/personal_access_tokens?name=diffui&scopes={scopes}"
scopes = ["api"]
env = { "*" = ["GITLAB_TOKEN", "GITLAB_ACCESS_TOKEN"] }
