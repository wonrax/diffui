[package]
name = "diffui-widgets"
version = "0.1.0"
edition = "2024"

[dependencies]
diffui-core = { path = "../core" }
gpui-kit = { workspace = true }
# Already in the tree through GPUI: the diff's no-shaping wrap breaks lines where the
# engine would.
icu_segmenter = "2.3"
raw-window-handle = "0.6"
tracing = "0.1"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

# Build-time only: fetch + checksum the Lucide icon font (see build.rs). `ureq`
# rides on rustls so the download needs no system TLS libs on any platform.
[build-dependencies]
sha2 = "0.11"
ureq = "3"

# `chrome` moves the native traffic lights to the center of the tab strip.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSString", "NSGeometry"] }
# Already in the tree through gpui-kit; named so a measurement can shape text off
# the main thread, which building a whole platform refuses to do (tests run there).
gpui-apple = { package = "gpui-pre-apple", version = "=0.3.11" }
