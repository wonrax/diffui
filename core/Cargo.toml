[package]
name = "diffui-core"
version = "0.1.0"
edition = "2024"
[features]
default = ["watcher"]
# Profiling-only: gates the `heap_bytes`/`uncapped` size-introspection helpers.
# The app's `track-alloc` feature forwards to this one.
track-alloc = []
# Filesystem watcher (the `notify`-backed `RepoWatcher`). Default-on; a headless
# or `--no-default-features` build — or a frontend that supplies its own change
# source — drops the `notify` dependency.
watcher = ["dep:notify"]
# Test-only: `repo::fault` arms a panic inside an actor so the recovery path
# can be exercised. The dev-dependency on this crate below turns it on for the
# integration tests; nothing else should enable it.
fault-injection = []

# Fetch and checksum the highlights module, then translate it to C and
# compile it (see build.rs). ureq and sha2 match the app's build.rs.
[build-dependencies]
cc = "1"
sha2 = "0.11"
ureq = "3"

[dev-dependencies]
# `tokio::time::pause`, so the watcher's debounce is tested against a virtual
# clock rather than by sleeping through it.
tokio = { version = "1.44", features = ["test-util"] }
diffui-core = { path = ".", features = ["fault-injection"] }

[dependencies]
anyhow = "1.0"
bstr = "1.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
jj-lib = "0.45.1"
# Both already in the tree transitively via jj-lib; used by the GitHub
# files-API fallback (per-file JSON entries with embedded patches).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["fs", "io-util", "macros", "process", "time", "rt", "sync"] }
# Structured logging for the repository actor: one span per command, so a
# stuck or slow operation is attributable without an `eprintln!` trail.
tracing = "0.1"
notify = { version = "8", optional = true }
# Unicode identifier classes for the highlighter's ECMAScript lexers (see
# `highlights`). Already in the tree through proc-macro2.
unicode-ident = "1"
jj-cli = { version = "0.45.1", default-features = false, features = ["git"] }
# Already in the tree through jj-lib, same version and features: reads git's
# config for `core.excludesFile` the way jj-cli does.
gix = { version = "0.87.1", default-features = false }
clap = "4.5"
# Image and SVG previews in diffs (`media`). The same versions iced's image and
# svg features build; codecs are limited to the formats a repo commonly holds.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico", "bmp"] }
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
