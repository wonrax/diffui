[package]
name = "diffui-core"
version = "0.1.0"
edition = "2024"
[features]
default = ["watcher"]
# Adds back every arborium grammar the curated set below leaves out. Parse
# tables are linked into the binary whether or not a repo ever contains the
# language — the full set is 158 MB of a 200 MB release build, Lean and Verilog
# 17 MB each — so the default keeps the languages a jj or git user diffs day to
# day and this feature pays for the long tail. The app forwards it under the
# same name.
lang-all = [
    "arborium/lang-ada",
    "arborium/lang-agda",
    "arborium/lang-asciidoc",
    "arborium/lang-asm",
    "arborium/lang-awk",
    "arborium/lang-batch",
    "arborium/lang-caddy",
    "arborium/lang-capnp",
    "arborium/lang-cedar",
    "arborium/lang-cedarschema",
    "arborium/lang-clojure",
    "arborium/lang-cobol",
    "arborium/lang-commonlisp",
    "arborium/lang-d",
    "arborium/lang-dart",
    "arborium/lang-devicetree",
    "arborium/lang-dot",
    "arborium/lang-elisp",
    "arborium/lang-elixir",
    "arborium/lang-elm",
    "arborium/lang-erlang",
    "arborium/lang-fsharp",
    "arborium/lang-gleam",
    "arborium/lang-glsl",
    "arborium/lang-graphql",
    "arborium/lang-groovy",
    "arborium/lang-haskell",
    "arborium/lang-hlsl",
    "arborium/lang-idris",
    "arborium/lang-jinja2",
    "arborium/lang-jq",
    "arborium/lang-julia",
    "arborium/lang-lean",
    "arborium/lang-matlab",
    "arborium/lang-meson",
    "arborium/lang-ninja",
    "arborium/lang-ocaml",
    "arborium/lang-perl",
    "arborium/lang-php",
    "arborium/lang-postscript",
    "arborium/lang-powershell",
    "arborium/lang-prolog",
    "arborium/lang-query",
    "arborium/lang-r",
    "arborium/lang-rego",
    "arborium/lang-rescript",
    "arborium/lang-ron",
    "arborium/lang-scala",
    "arborium/lang-scheme",
    "arborium/lang-solidity",
    "arborium/lang-sparql",
    "arborium/lang-sql",
    "arborium/lang-ssh-config",
    "arborium/lang-starlark",
    "arborium/lang-styx",
    "arborium/lang-svelte",
    "arborium/lang-textproto",
    "arborium/lang-thrift",
    "arborium/lang-tlaplus",
    "arborium/lang-typst",
    "arborium/lang-uiua",
    "arborium/lang-vb",
    "arborium/lang-verilog",
    "arborium/lang-vhdl",
    "arborium/lang-vim",
    "arborium/lang-vue",
    "arborium/lang-wit",
    "arborium/lang-x86asm",
    "arborium/lang-yuri",
]
# Profiling-only: gates the `heap_bytes`/`uncapped` size-introspection helpers.
# The app's `track-alloc` feature forwards to this one.
track-alloc = []
# Filesystem watcher (the `notify`-backed `RepoWatcher`). Default-on; a headless
# or `--no-default-features` build — or a frontend that supplies its own change
# source — drops the `notify` dependency.
watcher = ["dep:notify"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bstr = "1.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
jj-lib = "0.40.0"
# Both already in the tree transitively via jj-lib; used by the GitHub
# files-API fallback (per-file JSON entries with embedded patches).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["fs", "macros", "process", "time", "rt", "sync"] }
# Structured logging for the repository actor: one span per command, so a
# stuck or slow operation is attributable without an `eprintln!` trail.
tracing = "0.1"
notify = { version = "8", optional = true }
# Syntax highlighting; the grammar list is curated for size (see `lang-all`
# above). CMake and HCL sit alongside the languages proper because C and
# infrastructure trees diff their build and config files as often as sources.
arborium = { version = "2.16.0", features = [
    "lang-bash",
    "lang-c",
    "lang-c-sharp",
    "lang-cmake",
    "lang-cpp",
    "lang-css",
    "lang-diff",
    "lang-dockerfile",
    "lang-fish",
    "lang-go",
    "lang-hcl",
    "lang-html",
    "lang-ini",
    "lang-java",
    "lang-javascript",
    "lang-json",
    "lang-kotlin",
    "lang-lua",
    "lang-markdown",
    "lang-nix",
    "lang-objc",
    "lang-python",
    "lang-ruby",
    "lang-rust",
    "lang-scss",
    "lang-swift",
    "lang-toml",
    "lang-tsx",
    "lang-typescript",
    "lang-xml",
    "lang-yaml",
    "lang-zig",
    "lang-zsh",
] }
